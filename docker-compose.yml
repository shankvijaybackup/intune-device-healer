services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://healer:healer@db:5432/healer
      - ATOMICWORK_BASE_URL=${ATOMICWORK_BASE_URL}
      - ATOMICWORK_API_KEY=${ATOMICWORK_API_KEY}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=healer
      - POSTGRES_PASSWORD=healer
      - POSTGRES_DB=healer
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healer"]
      interval: 5s
      timeout: 5s
      retries: 5
