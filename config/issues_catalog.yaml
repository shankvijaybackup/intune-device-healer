# =============================================================================
# Intune Device Healer – Top 100 Issues Catalog
# =============================================================================
# Structure per issue:
#   id          : unique issue number
#   name        : short issue name
#   description : what goes wrong
#   lifecycle   : onboarding | daily | offboarding
#   platforms   : list – windows | macos | ios | android | all
#   severity    : critical | high | medium | low
#   tier        : 1 (auto) | 2 (semi-auto) | 3 (manual/approval)
#   tool        : MCP tool function name to call
#   params      : default parameters (device_id always required at call time)
#   tags        : searchable labels
# =============================================================================

issues:

  # ===========================================================================
  # SECTION 1: ONBOARDING  (Issues 1-15)
  # ===========================================================================

  - id: 1
    name: "Windows Autopilot enrollment failure"
    description: >
      Device fails to complete Autopilot provisioning during OOBE.
      Symptoms: stuck at setup screen, profile not delivered, AAD join fails.
    lifecycle: onboarding
    platforms: [windows]
    severity: critical
    tier: 1
    tool: fix_enrollment_autopilot
    params: {}
    tags: [enrollment, autopilot, oobe, aad-join, windows]

  - id: 2
    name: "Apple ADE/DEP enrollment failure"
    description: >
      macOS or iOS device does not receive MDM enrollment profile during
      Setup Assistant. ADE token may be stale or profile unassigned.
    lifecycle: onboarding
    platforms: [macos, ios]
    severity: critical
    tier: 1
    tool: fix_enrollment_apple_ade
    params: {}
    tags: [enrollment, ade, dep, abm, macos, ios, setup-assistant]

  - id: 3
    name: "Android Enterprise enrollment failure"
    description: >
      Android device fails to enroll in Android Enterprise (Work Profile,
      COPE, or COBO). Google Play sign-in blocked or enrollment token expired.
    lifecycle: onboarding
    platforms: [android]
    severity: critical
    tier: 1
    tool: fix_enrollment_android
    params: {}
    tags: [enrollment, android-enterprise, work-profile, google-play]

  - id: 4
    name: "Corporate Wi-Fi profile not deployed"
    description: >
      Device cannot connect to corporate SSID because Wi-Fi configuration
      profile (including 802.1x / SCEP cert) has not been delivered by Intune.
    lifecycle: onboarding
    platforms: [windows, macos, ios, android]
    severity: high
    tier: 1
    tool: push_wifi_profile
    params: {}
    tags: [wifi, connectivity, profile, 802.1x, onboarding]

  - id: 5
    name: "VPN certificate / profile not deployed"
    description: >
      Corporate VPN client is not configured. VPN profile or its dependent
      authentication certificate has not been pushed to the device.
    lifecycle: onboarding
    platforms: [windows, macos, ios, android]
    severity: high
    tier: 1
    tool: push_vpn_profile
    params: {}
    tags: [vpn, connectivity, profile, certificate, onboarding]

  - id: 6
