apiVersion: v1
kind: Secret
metadata:
  name: {{ include "intune-device-healer.fullname" . }}-secrets
type: Opaque
stringData:
  AZURE_CLIENT_ID: {{ .Values.secrets.azureClientId | quote }}
  AZURE_TENANT_ID: {{ .Values.secrets.azureTenantId | quote }}
  AZURE_CLIENT_SECRET: {{ .Values.secrets.azureClientSecret | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  HEALER_USERS: {{ .Values.secrets.healerUsers | quote }}
  MCP_API_KEY: {{ .Values.secrets.mcpApiKey | quote }}
  ATOMICWORK_API_URL: {{ .Values.secrets.atomicworkApiUrl | quote }}
  ATOMICWORK_API_KEY: {{ .Values.secrets.atomicworkApiKey | quote }}
